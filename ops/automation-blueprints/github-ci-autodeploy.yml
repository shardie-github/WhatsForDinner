name: Auto-Deploy to Vercel (Main Branch)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SITE_URL: https://${{ secrets.VERCEL_PROJECT_DOMAIN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.0.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm test:ci

      - name: Build Application
        run: pnpm run build:web

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1

      - name: Supabase Login & Link
        run: |
          pnpm run supa:login
          pnpm run supa:link

      - name: Apply Supabase Migrations
        run: pnpm run supa:migrate:apply

      - name: Vercel Pull & Build
        run: |
          pnpm run vercel:pull
          pnpm run vercel:build

      - name: Deploy to Vercel Production
        run: pnpm run vercel:deploy:prod

      - name: Post-Deploy Health Check
        run: |
          sleep 10
          curl -f https://${{ secrets.VERCEL_PROJECT_DOMAIN }} || exit 1
          echo "Deployment successful ✓"

      - name: Generate Deployment Report
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed At:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✅ Success" >> $GITHUB_STEP_SUMMARY
