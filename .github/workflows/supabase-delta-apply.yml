name: Supabase Delta Migrate & Verify
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "scripts/agents/generate_delta_migration.ts"
      - "supabase/migrations/**.sql"
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install deps
        run: npm ci || true
      - name: Build Delta
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: tsx scripts/agents/generate_delta_migration.ts
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Apply via Supabase CLI
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -n "$SUPABASE_PROJECT_REF" ]; then
            supabase link --project-ref "$SUPABASE_PROJECT_REF" || true
            supabase db push --include-all || supabase db push --db-url "$SUPABASE_DB_URL" --include-all
          else
            supabase db push --db-url "$SUPABASE_DB_URL" --include-all
          fi
      - name: Fallback psql per-file if CLI fails
        if: failure()
        env: { SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }} }
        run: |
          echo "CLI failed; fallback to psql"
          for f in $(ls -1 supabase/migrations/*.sql | sort -V); do
            echo "Applying $f"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$f" || echo "Migration $f failed or already applied"
          done
      - name: Verify Post-Apply
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: tsx scripts/agents/verify_db.ts
      - name: System Doctor
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: tsx scripts/agents/system_doctor.ts || true
      - name: Notify
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: tsx scripts/agents/notify.ts --message="Migration applied successfully" || true
