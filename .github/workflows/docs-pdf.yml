name: Generate Business Docs PDFs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/business/**/*.md'
  workflow_dispatch:
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'

jobs:
  generate-pdfs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install -g @marp-team/marp-cli
          npm install -g puppeteer

      - name: Create output directory
        run: |
          mkdir -p docs/business/_pdf

      - name: Generate PDFs from Markdown
        run: |
          # Find all markdown files in docs/business (excluding README and _pdf)
          find docs/business -name "*.md" -not -path "*/_pdf/*" -not -name "00_README.md" | while read file; do
            # Get relative path without extension
            rel_path="${file#docs/business/}"
            dir_path="docs/business/_pdf/$(dirname "$rel_path")"
            filename="$(basename "$rel_path" .md)"
            
            # Create directory structure
            mkdir -p "$dir_path"
            
            # Generate PDF using Marp
            marp "$file" --pdf --output "$dir_path/$filename.pdf" --theme-set docs/.theme/marp-config.json || echo "Failed to generate PDF for $file"
          done

      - name: Check for CAD currency consistency
        run: |
          # Check for USD references (should be CAD)
          if grep -r "USD\|\\$[0-9]" docs/business --include="*.md" | grep -v "CAD\|Canadian"; then
            echo "Warning: Found USD references or non-CAD currency"
            exit 1
          fi

      - name: Check for broken links
        run: |
          # Simple link checker (checks for markdown links)
          find docs/business -name "*.md" -exec grep -oP '\[.*?\]\(.*?\)' {} \; | while read link; do
            # Extract URL from markdown link
            url=$(echo "$link" | sed -n 's/.*(\(.*\))/\1/p')
            if [[ "$url" == http* ]] && ! curl -s --head "$url" | head -n 1 | grep -q "200 OK"; then
              echo "Warning: Broken link: $url"
            fi
          done || true

      - name: Upload PDFs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: business-docs-pdfs
          path: docs/business/_pdf/**/*.pdf
          retention-days: 30

      - name: Commit PDFs (optional)
        if: github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/business/_pdf/
          git diff --staged --quiet || git commit -m "docs: auto-generate PDFs from Markdown [skip ci]"
          git push || echo "No changes to commit"
