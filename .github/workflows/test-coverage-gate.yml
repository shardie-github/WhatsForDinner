name: Test Coverage Gate

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  coverage-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PRISMA_CLIENT_ENGINE_TYPE: wasm
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run tests with coverage
        run: pnpm test:coverage
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Check coverage threshold
        run: |
          echo "Checking test coverage threshold (80%)..."
          
          # Try to extract coverage from test output
          # This is a simplified check - adjust based on your test runner output
          COVERAGE_OUTPUT=$(pnpm test:coverage 2>&1 || true)
          
          # Check if coverage files exist
          if [ -f "coverage/coverage-summary.json" ]; then
            # Extract total coverage percentage
            TOTAL_COVERAGE=$(node -e "
              const fs = require('fs');
              const coverage = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
              const total = coverage.total;
              const lines = total.lines.pct;
              const statements = total.statements.pct;
              const functions = total.functions.pct;
              const branches = total.branches.pct;
              const avg = (lines + statements + functions + branches) / 4;
              console.log(Math.round(avg));
            ")
            
            echo "Current coverage: ${TOTAL_COVERAGE}%"
            
            if [ "$TOTAL_COVERAGE" -lt 80 ]; then
              echo "❌ Test coverage (${TOTAL_COVERAGE}%) is below 80% threshold"
              echo "Please increase test coverage before merging."
              exit 1
            else
              echo "✅ Test coverage (${TOTAL_COVERAGE}%) meets 80% threshold"
            fi
          else
            echo "⚠️  Coverage report not found. Running tests to generate..."
            pnpm test:coverage || true
            echo "⚠️  Coverage check skipped - ensure coverage reports are generated"
          fi
