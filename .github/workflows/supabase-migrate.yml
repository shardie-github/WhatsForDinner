name: Supabase Migrations

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: supabase-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Supabase Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Login to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set. Please add it to GitHub Secrets."
            exit 1
          fi
          echo "Logging in to Supabase..."
          npx supabase@latest login --token "$SUPABASE_ACCESS_TOKEN"

      - name: Link to Supabase project
        env:
          SUPABASE_PROJECT_REF: ramptcbrcfuudlrybzng
        run: |
          set -euo pipefail
          echo "Linking to Supabase project: $SUPABASE_PROJECT_REF"
          npx supabase@latest link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Run migrations
        run: |
          set -euo pipefail
          echo "Applying pending migrations..."
          npx supabase@latest migration up
          echo "✅ Migrations applied successfully"
