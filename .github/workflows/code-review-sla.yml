name: Code Review SLA Checker

on:
  schedule:
    # Every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]

jobs:
  check-sla:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR review SLA
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              sort: 'created',
              direction: 'desc',
            });

            const now = new Date();
            const slaWarnings = [];

            for (const pr of prs) {
              const createdAt = new Date(pr.created_at);
              const hoursSinceCreation = (now - createdAt) / (1000 * 60 * 60);
              
              // Determine priority from labels
              const labels = pr.labels.map(l => l.name);
              let slaHours = 24; // default normal priority
              
              if (labels.includes('priority:urgent')) {
                slaHours = 4;
              } else if (labels.includes('priority:low')) {
                slaHours = 48;
              }

              // Check if auto-approve eligible
              const isAutoApprove = labels.includes('auto-approve') ||
                pr.title.toLowerCase().includes('[auto-approve]') ||
                pr.labels.some(l => l.name === 'dependencies' || l.name === 'documentation');

              if (isAutoApprove) {
                continue; // Skip auto-approve PRs
              }

              // Check if review requested
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
              });

              const hasApproval = reviews.some(r => r.state === 'APPROVED');
              const hasReview = reviews.length > 0;

              if (hasApproval) {
                continue; // Already approved
              }

              // Check SLA
              if (hoursSinceCreation >= slaHours) {
                const overdueHours = Math.floor(hoursSinceCreation - slaHours);
                slaWarnings.push({
                  pr: pr.number,
                  title: pr.title,
                  hours: Math.floor(hoursSinceCreation),
                  overdue: overdueHours,
                  priority: slaHours === 4 ? 'urgent' : slaHours === 48 ? 'low' : 'normal',
                  url: pr.html_url,
                });
              } else if (hoursSinceCreation >= slaHours * 0.75 && !hasReview) {
                // Warn at 75% of SLA
                slaWarnings.push({
                  pr: pr.number,
                  title: pr.title,
                  hours: Math.floor(hoursSinceCreation),
                  overdue: 0,
                  priority: slaHours === 4 ? 'urgent' : slaHours === 48 ? 'low' : 'normal',
                  url: pr.html_url,
                  warning: true,
                });
              }
            }

            if (slaWarnings.length > 0) {
              let comment = '## ⚠️ Code Review SLA Status\n\n';
              
              const overdue = slaWarnings.filter(w => w.overdue > 0);
              const warnings = slaWarnings.filter(w => w.warning);

              if (overdue.length > 0) {
                comment += '### 🔴 Overdue Reviews\n\n';
                overdue.forEach(w => {
                  comment += `- [ ] PR #${w.pr}: **${w.title}** (${w.overdue}h overdue, ${w.priority} priority) - ${w.url}\n`;
                });
                comment += '\n';
              }

              if (warnings.length > 0) {
                comment += '### 🟡 Approaching SLA Deadline\n\n';
                warnings.forEach(w => {
                  comment += `- [ ] PR #${w.pr}: **${w.title}** (${w.hours}h old, ${w.priority} priority) - ${w.url}\n`;
                });
                comment += '\n';
              }

              comment += '---\n';
              comment += '**SLA Policy:** See [CODE_REVIEW_SLA.md](.github/CODE_REVIEW_SLA.md)\n';
              comment += '**Action Required:** Please review or escalate if SLA cannot be met.';

              // Comment on each overdue PR
              for (const warning of overdue) {
                try {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: warning.pr,
                    body: `⚠️ This PR is ${warning.overdue}h overdue for review (${warning.priority} priority, ${warning.hours}h old).\n\nPlease review or escalate per [SLA policy](.github/CODE_REVIEW_SLA.md).`,
                  });
                } catch (error) {
                  console.error(`Failed to comment on PR #${warning.pr}:`, error);
                }
              }

              console.log(comment);
            } else {
              console.log('✅ All PRs are within SLA');
            }
