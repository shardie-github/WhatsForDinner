name: Pre-Merge Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  pre-merge-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pre-merge validation
        run: node scripts/pre-merge-validation.mjs

      - name: Comment PR with results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            
            let status = '✅';
            let message = 'All pre-merge checks passed!';
            
            try {
              execSync('node scripts/pre-merge-validation.mjs', { stdio: 'pipe' });
            } catch (error) {
              status = '❌';
              message = 'Pre-merge validation failed. Please fix the issues above.';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Pre-Merge Validation Results\n\n${status} ${message}\n\nSee workflow logs for details.`
            });
