name: Quality Gates

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: |
          cd apps/web
          pnpm type-check
        continue-on-error: false

      - name: Check type coverage
        run: |
          cd apps/web
          pnpm type:coverage
        continue-on-error: true

      - name: Run tests
        run: pnpm test:ci
        continue-on-error: false

      - name: Check bundle size (stub)
        run: |
          echo "Bundle size check - TODO: Add @next/bundle-analyzer"
          echo "Target: 0KB delta (from inputs)"
        continue-on-error: true

      - name: Check telemetry coverage
        run: |
          cd apps/web
          pnpm obs:check || echo "Some endpoints missing telemetry"
        continue-on-error: true

      - name: Quality Gate Summary
        if: always()
        run: |
          echo "## Quality Gates Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Type check: ${{ job.status == 'success' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: ${{ job.status == 'success' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Bundle size: ⚠️ (not implemented)" >> $GITHUB_STEP_SUMMARY
          echo "- Telemetry: ⚠️ (check logs)" >> $GITHUB_STEP_SUMMARY
