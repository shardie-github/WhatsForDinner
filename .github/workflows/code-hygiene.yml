name: Code Hygiene

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PRISMA_CLIENT_ENGINE_TYPE: wasm
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Type check
        run: pnpm typecheck
        continue-on-error: true

      - name: Lint
        run: pnpm lint
        continue-on-error: true

      - name: Check unused exports
        run: pnpm prune:exports > reports/ts-prune.txt || true

      - name: Scan for unused files
        run: pnpm scan:usage || true

      - name: Audit dependencies
        run: pnpm audit:deps || true

      - name: Check unused ESLint disables
        run: pnpm lint:unused || true

      - name: Upload hygiene reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hygiene-reports
          path: reports/*.json
          retention-days: 7

      - name: Upload ts-prune report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ts-prune-report
          path: reports/ts-prune.txt
          retention-days: 7
