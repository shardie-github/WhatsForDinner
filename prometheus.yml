# Prometheus Configuration for Nomad
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'nomad-production'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - 'alerts.yml'

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Nomad Backend Service
  - job_name: 'nomad-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:9464']  # Docker internal host
        labels:
          service: 'backend'
          environment: 'production'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Health Check Monitoring
  - job_name: 'nomad-health'
    metrics_path: '/healthz'
    static_configs:
      - targets: ['host.docker.internal:3000']  # Adjust port as needed
        labels:
          service: 'web'
          environment: 'production'

  # Loki for log aggregation (if using Promtail)
  - job_name: 'promtail'
    static_configs:
      - targets: ['promtail:9080']

# Remote write configuration (optional - for long-term storage)
# remote_write:
